name: Flutter CI

# GitHub only reads workflows from the repository root, so this file lives
# here and points at the Flutter project in ./codewithgideon.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codewithgideon

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Reports formatting drift without failing the build. Run
      # `dart format lib test` once and commit, then remove continue-on-error.
      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # Also posts the issue list as a single annotation, so it is visible
      # on the PR's Checks tab without opening the raw log.
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ "$code" -ne 0 ]; then
            issues=$(grep ' • ' analyze.txt | head -120 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter analyze::${issues}"
          fi
          exit $code

      - name: Test
        run: flutter test
